name: Sync Instagram avatars

# Instagram's JSON API requires a login, but profile pages still render
# logged-out in a real browser — so this runs headless Chrome on a schedule and
# caches the results into Supabase. Runs here rather than on Vercel because the
# scrape takes a couple of minutes, well past a serverless function's budget.
on:
  schedule:
    # Weekly, Monday 09:00 UTC. Avatars change rarely and Instagram rate limits.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape without writing to Supabase'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Scrape and sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/scrape-instagram.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }}
